name: Integration

on:
  workflow_dispatch:
  pull_request:

jobs:
  databases:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

      mysql:
        image: mysql:9

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - run: uv sync --all-groups

      - run: uv run pytest -m database