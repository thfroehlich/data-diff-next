[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[project]
name = "data-diff-next"
version = "1.0.0a1"
description = "Next generation cross-database table diffing platform."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

authors = [
    { name = "Thorsten Fröhlich" }
]

keywords = [
    "data-diff",
    "database",
    "dbt",
    "duckdb",
    "postgresql",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "click>=8.1",
    "rich>=14",
    "pydantic>=2,<3",
    "typing-extensions>=4.12",
]

[project.scripts]
data-diff = "data_diff.cli.main:main"

[project.optional-dependencies]

postgresql = [
  "psycopg[binary]>=3.2"
]

mysql = [
  "mysql-connector-python>=9"
]

mssql = [
  "pyodbc>=5"
]

oracle = [
  "oracledb>=2"
]

duckdb = [
  "duckdb>=1"
]

clickhouse = [
  "clickhouse-driver>=0.2.8"
]

snowflake = [
  "snowflake-connector-python>=3.12"
]

trino = [
  "trino>=0.336"
]

presto = [
  "presto-python-client>=0.8.4"
]

vertica = [
  "vertica-python>=1.4"
]

dbt = [
  "dbt-core>=1.10,<2"
]

cloud = [
  "httpx>=0.28"
]

all-dbs = [
  "psycopg[binary]>=3.2",
  "mysql-connector-python>=9",
  "pyodbc>=5",
  "oracledb>=2",
  "duckdb>=1",
  "clickhouse-driver>=0.2.8",
  "snowflake-connector-python>=3.12",
  "trino>=0.336",
  "presto-python-client>=0.8.4",
  "vertica-python>=1.4",
]

[project.urls]
Homepage = "https://github.com/thfroehlich/data-diff-next"
Documentation = "https://thfroehlich.github.io/data-diff-next"
Issues = "https://github.com/thfroehlich/data-diff-next/issues"

[project.entry-points."data_diff.database_drivers"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM","C4","RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

markers = [
  "unit",
  "integration",
  "database",
  "network",
  "slow",
]

[tool.coverage.run]
source = ["data_diff"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pyright>=1.1",
    "ruff>=0.13",
    "mkdocs-material>=9",
]